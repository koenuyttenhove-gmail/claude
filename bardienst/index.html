<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bardienst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
  :root {
    --bg: #F4F3F7;
    --surface: #FFFFFF;
    --ink: #1D1A26;
    --muted: #686275;
    --line: #E0DDE7;
    --accent: #9E1F38;
    --accent-ink: #FFFFFF;
    --accent-soft: #FBE8EC;
    --ok: #1E7449;
    --ok-soft: #E3F2E9;
    --chip: #EEECF3;
    --mine: #FFF0D1;
    --mine-ink: #6A4700;
    --focus: #3B5BDB;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14121A;
      --surface: #1E1B26;
      --ink: #EEEAF5;
      --muted: #A49EB1;
      --line: #332F3E;
      --accent: #E0566F;
      --accent-ink: #1A0B10;
      --accent-soft: #3B1720;
      --ok: #62CB93;
      --ok-soft: #16331F;
      --chip: #2A2634;
      --mine: #3B2D10;
      --mine-ink: #F4CF84;
      --focus: #8EA4FF;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 var(--body);
    -webkit-text-size-adjust: 100%;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; }

  header.kop { padding-block: 28px 12px; }
  .eyebrow {
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin: 0 0 4px;
  }
  h1 {
    font-family: var(--display); font-weight: 800; font-size: clamp(30px, 6vw, 44px);
    line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.01em;
  }
  .intro { color: var(--muted); margin: 8px 0 0; max-width: 60ch; }

  .naambalk {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding-block: 12px;
  }
  .naambalk .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .naambalk label { font-weight: 700; }
  #naam {
    flex: 1 1 220px; max-width: 360px; min-width: 0;
    padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px;
    background: var(--surface);
  }
  #naam:focus { border-color: var(--focus); outline: none; }
  .samenvatting { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .samenvatting strong { color: var(--ink); }

  .banner {
    margin-top: 16px; padding: 10px 14px; border-radius: 8px;
    background: var(--mine); color: var(--mine-ink); font-size: 14px;
  }

  main { padding-block: 20px 48px; display: grid; gap: 16px; }

  .dag {
    display: grid; grid-template-columns: 84px 1fr;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden;
  }
  .dag.voorbij { opacity: .55; }
  .stub {
    padding: 16px 8px; text-align: center;
    border-right: 2px dashed var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
    font-variant-numeric: tabular-nums;
  }
  .stub .wd { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .stub .nr { font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1; }
  .stub .mnd { font-size: 13px; color: var(--muted); }
  .dag-body { padding: 14px 16px 16px; min-width: 0; }
  .dag-titel { margin: 0 0 12px; font-family: var(--display); font-weight: 600; font-size: 19px; }
  .dag-titel .info { font-family: var(--body); font-weight: 400; font-size: 14px; color: var(--muted); margin-left: 6px; }

  .functies { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .functie {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px;
    display: flex; flex-direction: column; gap: 10px; min-width: 0;
  }
  .functie-kop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .functie-naam { font-weight: 700; }
  .pil {
    font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .pil.tekort { background: var(--accent-soft); color: var(--accent); }
  .pil.ok { background: var(--ok-soft); color: var(--ok); }

  .namen { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; min-height: 30px; }
  .namen .leeg { color: var(--muted); font-size: 14px; align-self: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--chip); border-radius: 999px; padding: 3px 4px 3px 10px;
    font-size: 14px; max-width: 100%;
  }
  .chip span { overflow-wrap: anywhere; }
  .chip.mijn { background: var(--mine); color: var(--mine-ink); font-weight: 700; }
  .chip button {
    border: 0; background: transparent; cursor: pointer; border-radius: 999px;
    width: 24px; height: 24px; line-height: 1; font-size: 16px; color: inherit; opacity: .6;
  }
  .chip button:hover { opacity: 1; background: color-mix(in srgb, currentColor 12%, transparent); }
  .chip.bevestig { background: var(--accent-soft); color: var(--accent); padding-right: 4px; }
  .chip.bevestig button { width: auto; padding: 0 8px; font-size: 13px; font-weight: 700; opacity: 1; }

  .knop {
    border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink);
    border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; margin-top: auto;
  }
  .knop:hover { filter: brightness(1.08); }
  .knop:disabled { cursor: not-allowed; background: transparent; color: var(--muted); border-color: var(--line); filter: none; }
  .knop.staat { background: transparent; color: var(--ok); border-color: var(--ok); cursor: default; }

  .melding {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); max-width: calc(100% - 32px);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px;
    font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.2);
  }
  .melding.fout { background: var(--accent); color: var(--accent-ink); }

  .laden { color: var(--muted); padding: 24px 0; }

  @media (max-width: 720px) {
    .functies { grid-template-columns: 1fr; }
    .dag { grid-template-columns: 64px 1fr; }
    .stub .nr { font-size: 30px; }
    .dag-body { padding: 12px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .chip, .knop { transition: background-color .15s, color .15s, opacity .15s; }
  }
</style>
</head>
<body>
  <header class="kop wrap">
    <p class="eyebrow">Onthaal · Bar · Kassa</p>
    <h1 id="titel">Bardienst</h1>
    <p class="intro">Vul je naam in en klik op <strong>Ik kan</strong> bij elke dienst waar je beschikbaar bent. Meerdere mensen per dienst mag: zo zien we wie er kan.</p>
    <div class="banner" id="demo" hidden>Voorbeeldweergave met verzonnen namen. Wat je hier aanklikt, wordt niet opgeslagen.</div>
  </header>

  <div class="naambalk">
    <div class="wrap">
      <label for="naam">Jouw naam</label>
      <input id="naam" type="text" maxlength="40" autocomplete="name" placeholder="Voornaam en eerste letter familienaam">
      <span class="samenvatting" id="samenvatting"></span>
    </div>
  </div>

  <main class="wrap" id="dagen">
    <p class="laden">Rooster laden…</p>
  </main>

  <div class="melding" id="melding" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  var ECHT = typeof google !== 'undefined' && google.script && google.script.run;

  // Voorbeelddata voor als de pagina los (buiten Google) geopend wordt.
  var demo = {
    data: {
      titel: 'Bardienst',
      functies: [
        { id: 'onthaal', naam: 'Onthaal', nodig: 2 },
        { id: 'bar', naam: 'Bar', nodig: 3 },
        { id: 'kassa', naam: 'Kassa', nodig: 1 }
      ],
      dagen: [
        { key: '2026-11-07', info: 'Première' },
        { key: '2026-11-13', info: '' },
        { key: '2026-11-14', info: '' },
        { key: '2026-11-17', info: '' }
      ],
      inschrijvingen: [
        { id: 'd1', dag: '2026-11-07', functie: 'onthaal', naam: 'Els V.' },
        { id: 'd2', dag: '2026-11-07', functie: 'bar', naam: 'Tom D.' },
        { id: 'd3', dag: '2026-11-07', functie: 'bar', naam: 'Sarah M.' },
        { id: 'd4', dag: '2026-11-07', functie: 'bar', naam: 'Pieter C.' },
        { id: 'd5', dag: '2026-11-07', functie: 'bar', naam: 'Lien B.' },
        { id: 'd6', dag: '2026-11-07', functie: 'kassa', naam: 'Marc H.' },
        { id: 'd7', dag: '2026-11-13', functie: 'onthaal', naam: 'Els V.' },
        { id: 'd8', dag: '2026-11-13', functie: 'onthaal', naam: 'Ann W.' },
        { id: 'd9', dag: '2026-11-13', functie: 'bar', naam: 'Tom D.' },
        { id: 'd10', dag: '2026-11-14', functie: 'kassa', naam: 'Marc H.' },
        { id: 'd11', dag: '2026-11-14', functie: 'kassa', naam: 'Ann W.' }
      ],
      vandaag: '2026-09-25'
    },
    teller: 100,
    getData: function () { return this.data; },
    addSignup: function (dag, functie, naam) {
      naam = String(naam || '').replace(/\s+/g, ' ').trim();
      if (!naam) throw new Error('Vul eerst je naam in.');
      var dubbel = this.data.inschrijvingen.some(function (i) {
        return i.dag === dag && i.functie === functie && i.naam.toLowerCase() === naam.toLowerCase();
      });
      if (!dubbel) this.data.inschrijvingen.push({ id: 'd' + (this.teller++), dag: dag, functie: functie, naam: naam });
      return this.data;
    },
    removeSignup: function (id) {
      this.data.inschrijvingen = this.data.inschrijvingen.filter(function (i) { return i.id !== id; });
      return this.data;
    }
  };

  function roep(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (ECHT) {
        var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        r[fn].apply(r, args);
      } else {
        try { resolve(demo[fn].apply(demo, args)); } catch (e) { reject(e); }
      }
    });
  }

  var state = { data: null, bezig: false, bevestigId: null };
  var $dagen = document.getElementById('dagen');
  var $naam = document.getElementById('naam');
  var $samen = document.getElementById('samenvatting');
  var $melding = document.getElementById('melding');

  try { $naam.value = localStorage.getItem('bardienst-naam') || ''; } catch (e) {}
  $naam.addEventListener('input', function () {
    try { localStorage.setItem('bardienst-naam', $naam.value.trim()); } catch (e) {}
    render();
  });

  if (!ECHT) document.getElementById('demo').hidden = false;

  var meldTimer;
  function meld(tekst, fout) {
    $melding.textContent = tekst;
    $melding.className = 'melding' + (fout ? ' fout' : '');
    $melding.hidden = false;
    clearTimeout(meldTimer);
    meldTimer = setTimeout(function () { $melding.hidden = true; }, fout ? 5000 : 2500);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function mijnNaam() { return $naam.value.replace(/\s+/g, ' ').trim().toLowerCase(); }

  function datum(key) {
    var d = new Date(key + 'T12:00:00');
    return {
      wd: d.toLocaleDateString('nl-BE', { weekday: 'short' }).replace('.', ''),
      nr: d.getDate(),
      mnd: d.toLocaleDateString('nl-BE', { month: 'short' }).replace('.', ''),
      lang: d.toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' })
    };
  }

  function render() {
    var data = state.data;
    if (!data) return;
    document.getElementById('titel').textContent = data.titel;
    document.title = data.titel;

    var ik = mijnNaam();
    var open = 0, mijnDiensten = 0;
    var html = '';

    if (!data.dagen.length) {
      $dagen.innerHTML = '<p class="laden">Er staan nog geen speeldagen in het rooster.</p>';
      $samen.textContent = '';
      return;
    }

    data.dagen.forEach(function (dag) {
      var dt = datum(dag.key);
      var voorbij = dag.key < data.vandaag;
      html += '<article class="dag' + (voorbij ? ' voorbij' : '') + '">' +
        '<div class="stub" aria-hidden="true"><span class="wd">' + esc(dt.wd) + '</span><span class="nr">' + dt.nr +
        '</span><span class="mnd">' + esc(dt.mnd) + '</span></div>' +
        '<div class="dag-body"><h2 class="dag-titel">' + esc(dt.lang.charAt(0).toUpperCase() + dt.lang.slice(1)) +
        (dag.info ? '<span class="info">' + esc(dag.info) + '</span>' : '') +
        (voorbij ? '<span class="info">voorbij</span>' : '') + '</h2><div class="functies">';

      data.functies.forEach(function (f) {
        var lijst = data.inschrijvingen.filter(function (i) { return i.dag === dag.key && i.functie === f.id; });
        var tekort = Math.max(0, f.nodig - lijst.length);
        if (!voorbij) open += tekort;
        var staatErop = ik && lijst.some(function (i) { return i.naam.toLowerCase() === ik; });
        if (staatErop && !voorbij) mijnDiensten++;

        html += '<section class="functie"><div class="functie-kop"><span class="functie-naam">' + esc(f.naam) + '</span>' +
          (tekort ? '<span class="pil tekort">nog ' + tekort + ' nodig</span>'
                  : '<span class="pil ok">' + lijst.length + ' / ' + f.nodig + ' ok</span>') +
          '</div><ul class="namen">';

        if (!lijst.length) html += '<li class="leeg">Nog niemand</li>';
        lijst.forEach(function (i) {
          var mijn = ik && i.naam.toLowerCase() === ik;
          if (state.bevestigId === i.id) {
            html += '<li class="chip bevestig"><span>' + esc(i.naam) + ' weghalen?</span>' +
              '<button type="button" data-actie="weg" data-id="' + esc(i.id) + '">Ja</button>' +
              '<button type="button" data-actie="annuleer">Nee</button></li>';
          } else {
            html += '<li class="chip' + (mijn ? ' mijn' : '') + '"><span>' + esc(i.naam) + '</span>' +
              (voorbij ? '' : '<button type="button" data-actie="vraag" data-id="' + esc(i.id) + '" aria-label="' +
                esc(i.naam) + ' weghalen bij ' + esc(f.naam) + '" title="Weghalen">×</button>') + '</li>';
          }
        });
        html += '</ul>';

        if (!voorbij) {
          if (staatErop) {
            html += '<button type="button" class="knop staat" disabled>Je staat erop</button>';
          } else {
            html += '<button type="button" class="knop" data-actie="kan" data-dag="' + esc(dag.key) + '" data-functie="' +
              esc(f.id) + '"' + (ik ? '' : ' disabled title="Vul eerst je naam in"') + '>Ik kan</button>';
          }
        }
        html += '</section>';
      });
      html += '</div></div></article>';
    });

    $dagen.innerHTML = html;
    $samen.innerHTML = open
      ? 'Nog <strong>' + open + '</strong> ' + (open === 1 ? 'plaats' : 'plaatsen') + ' open'
      : '<strong>Alle diensten zijn ingevuld</strong>';
    if (ik) $samen.innerHTML += ' · jij staat op <strong>' + mijnDiensten + '</strong> ' + (mijnDiensten === 1 ? 'dienst' : 'diensten');
  }

  function laad(stil) {
    return roep('getData').then(function (d) {
      state.data = d;
      render();
    }).catch(function (e) {
      if (!stil) {
        $dagen.innerHTML = '<p class="laden">Het rooster kon niet geladen worden. Vernieuw de pagina en probeer opnieuw.</p>';
        meld((e && e.message) || 'Laden mislukt.', true);
      }
    });
  }

  $dagen.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-actie]');
    if (!btn || state.bezig) return;
    var actie = btn.getAttribute('data-actie');

    if (actie === 'vraag') { state.bevestigId = btn.getAttribute('data-id'); render(); return; }
    if (actie === 'annuleer') { state.bevestigId = null; render(); return; }

    var naam = $naam.value.replace(/\s+/g, ' ').trim();
    var p;
    if (actie === 'kan') {
      if (!naam) { $naam.focus(); meld('Vul eerst je naam in bovenaan.', true); return; }
      p = roep('addSignup', btn.getAttribute('data-dag'), btn.getAttribute('data-functie'), naam)
        .then(function (d) { meld('Genoteerd, bedankt!'); return d; });
    } else if (actie === 'weg') {
      p = roep('removeSignup', btn.getAttribute('data-id'))
        .then(function (d) { meld('Naam weggehaald.'); return d; });
    } else {
      return;
    }

    state.bezig = true;
    btn.disabled = true;
    btn.textContent = 'Even geduld…';
    p.then(function (d) {
      state.data = d;
    }).catch(function (e) {
      meld((e && e.message) || 'Opslaan mislukt. Probeer opnieuw.', true);
    }).then(function () {
      state.bezig = false;
      state.bevestigId = null;
      render();
    });
  });

  laad(false);
  // Houd het rooster actueel terwijl de pagina open staat.
  setInterval(function () {
    if (!document.hidden && !state.bezig && state.bevestigId === null) laad(true);
  }, 30000);
})();
</script>
</body>
</html>
